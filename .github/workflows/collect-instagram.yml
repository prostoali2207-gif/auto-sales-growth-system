name: Collect Instagram competitor reels

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Collect competitor reels
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run collect:instagram -- config/competitors.json data/raw/instagram

      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-competitor-data
          path: data/raw/instagram
          if-no-files-found: warn
          retention-days: 14
