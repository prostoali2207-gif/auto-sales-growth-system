name: UAE Market Intelligence Qualification

on:
  push:
    branches:
      - agent/market-intelligence-specialization-2026-08-20
    paths:
      - 'agents/market-intelligence.md'
      - 'data-schemas/market-intelligence-report.schema.json'
      - 'evaluation/market-intelligence/**'
      - '.github/workflows/market-intelligence-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic contract and schema preflight
        run: |
          python -m py_compile evaluation/market-intelligence/run-qualification.py
          python - <<'PY'
          import json
          p='data-schemas/market-intelligence-report.schema.json'
          s=json.load(open(p))
          text=json.dumps(s)
          assert 'test_candidates' not in text
          assert 'strategist_handoff' in s['required']
          assert s['properties']['research_contract']['properties']['downstream_owner']['const']=='STRATEGIST'
          assert s['properties']['strategist_handoff']['properties']['owner']['const']=='STRATEGIST'
          cases=json.load(open('evaluation/market-intelligence/uae-delta-cases-v0.1.json'))
          practical=json.load(open('evaluation/market-intelligence/uae-practical-case-v0.1.json'))
          assert len(cases)==7 and len({c['id'] for c in cases})==7
          assert practical['id']=='UAE-MI-P01'
          print('UAE MI deterministic contract OK')
          PY
      - name: Require existing Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY missing; no semantic calls attempted.' >&2; exit 2)
      - name: Run applied delta and practical qualification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UAE_MI_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          UAE_MI_TRIALS: '3'
          UAE_MI_429_BACKOFF_SECONDS: '20'
        run: |
          rm -rf .tmp/uae-market-intelligence
          python evaluation/market-intelligence/run-qualification.py
      - name: Upload sealed qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-market-intelligence-${{ github.sha }}
          path: .tmp/uae-market-intelligence
          if-no-files-found: ignore
