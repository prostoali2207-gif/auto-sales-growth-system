name: Meta Organic Access Probe

on:
  push:
    paths:
      - .github/workflows/meta-organic-access-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: meta-ads-production
    steps:
      - name: Probe existing Meta credential without writes
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: |
          node <<'NODE'
          const targetPageId = '1135061356346488';
          const token = process.env.META_ACCESS_TOKEN || '';
          const version = process.env.META_GRAPH_API_VERSION || '';
          const out = {
            token_present: Boolean(token),
            graph_version_present: Boolean(version),
            token_valid: false,
            target_page_found: false,
            target_page_tasks: [],
            instagram_business_account: null,
            page_profile_readable: false,
            page_name: null,
            error: null
          };
          if (!token || !version) {
            out.error = !token ? 'MISSING_META_ACCESS_TOKEN' : 'MISSING_META_GRAPH_API_VERSION';
            console.log(JSON.stringify(out));
            process.exit(0);
          }
          async function graph(path) {
            const r = await fetch(`https://graph.facebook.com/${version}/${path}`, {
              headers: { authorization: `Bearer ${token}` }
            });
            const data = await r.json().catch(() => ({}));
            return { ok: r.ok, status: r.status, data };
          }
          const accounts = await graph('me/accounts?fields=id,name,tasks,instagram_business_account{id,username}&limit=100');
          if (!accounts.ok) {
            out.error = accounts.data?.error?.message || `GRAPH_${accounts.status}`;
            console.log(JSON.stringify(out));
            process.exit(0);
          }
          out.token_valid = true;
          const page = (accounts.data?.data || []).find((p) => String(p.id) === targetPageId);
          if (!page) {
            console.log(JSON.stringify(out));
            process.exit(0);
          }
          out.target_page_found = true;
          out.page_name = page.name || null;
          out.target_page_tasks = Array.isArray(page.tasks) ? page.tasks : [];
          if (page.instagram_business_account) {
            out.instagram_business_account = {
              id: String(page.instagram_business_account.id || ''),
              username: page.instagram_business_account.username || null
            };
          }
          const profile = await graph(`${targetPageId}?fields=id,name,about,description,phone,website,location,instagram_business_account{id,username}`);
          out.page_profile_readable = profile.ok;
          if (!out.instagram_business_account && profile.data?.instagram_business_account) {
            out.instagram_business_account = {
              id: String(profile.data.instagram_business_account.id || ''),
              username: profile.data.instagram_business_account.username || null
            };
          }
          if (!profile.ok) out.error = profile.data?.error?.message || `PAGE_PROFILE_${profile.status}`;
          console.log(JSON.stringify(out));
          NODE
