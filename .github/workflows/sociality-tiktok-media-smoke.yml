name: Sociality TikTok media smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    if: github.head_ref == 'feat/sociality-tiktok-media-fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1
      - name: Fetch real Sociality TikTok media and extract frames
        env:
          SOCIAL_MEDIA_MAX_BYTES: '104857600'
          SOCIAL_MEDIA_FETCH_TIMEOUT_MS: '30000'
        run: |
          node scripts/fetch-sociality-tiktok-media.mjs \
            'https://v77.tiktokcdn-eu.com/8156626dc736c86c9de635a2744e848c/6a8abf24/video/tos/alisg/tos-alisg-pve-0037c001/oMCBiBBReE6puJhjIQLSifhEc0YKqEAk2B7Rgm/?a=1233&bti=M0BzOTg7QGo6OjZALnAjLTAzYCMxNDNg&&bt=1065&ft=XsFbEqx4m3lPD12.hFsI3wU3QDwKaeF~O5&mime_type=video_mp4&rc=O2loOTszOTo2NzVoOzw3O0Bpamg6c3Q5cjV3PDMzODczNEAwY2A0YzQyXi0xNi01YjFeYSNkay01MmRjLmVhLS1kMWBzcw%3D%3D&vvpl=1&l=20260822173507EBA32BE02AA59D2DC7B9&btag=e00048000' \
            'https://www.tiktok.com/@naeem.bhai.used.cars/video/7666200784245230868' \
            'data/analysis/tiktok-hook-frames'
      - name: Assert observable output
        run: |
          test -f data/analysis/tiktok-hook-frames/7666200784245230868__0s.jpg
          test -f data/analysis/tiktok-hook-frames/7666200784245230868__1s.jpg
          test -f data/analysis/tiktok-hook-frames/7666200784245230868__3s.jpg
          test -f data/analysis/tiktok-hook-frames/7666200784245230868.manifest.json
          test ! -f data/analysis/tiktok-hook-frames/7666200784245230868.mp4
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data/analysis/tiktok-hook-frames/7666200784245230868.manifest.json')); if(m.frames.length!==3||m.temporaryVideoRetained!==false||!m.sha256) process.exit(1); console.log(JSON.stringify(m,null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: sociality-tiktok-smoke-frames
          path: data/analysis/tiktok-hook-frames/
          if-no-files-found: error
